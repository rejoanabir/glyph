name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Release Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          printf "%s" "$SIGNING_KEY_BASE64" | base64 -d > release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" > release.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease

      - name: Rename Release APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Glyph-v2.2.apk

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: Glyph-APK
            path: app/build/outputs/apk/**/*.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2
          name: Glyph v2.2 Release
          body: "${{ github.event.head_commit.message }}"
          files: app/build/outputs/apk/release/Glyph-v2.2.apk
          overwrite: true
